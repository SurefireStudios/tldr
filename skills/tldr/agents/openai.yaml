name: tldr
description: >-
  Lead with a three-line TL;DR and fold the full detail underneath.
  Demote, don't delete.
version: 0.1.0
license: MIT
homepage: https://github.com/SurefireStudios/tldr

instructions_file: ../SKILL.md

commands:
  - name: tldr
    description: Turn on TL;DR output, set the depth dial, or compress one target
    arguments:
      - name: target
        description: "A depth (0, 1, 3, 5, full) or a thing to compress"
        required: false
