name: Sync skill mirrors

# `skills/<name>/` is the single source of truth for each skill: SKILL.md is the
# core, reference.md the long form it links to. Harnesses that cannot read from
# that path get a copy, and a copy that drifts is worse than no copy: two
# harnesses would follow two different rulesets while both claiming to run tldr.
#
# CI fails a pull request whose mirrors have drifted. This workflow fixes the
# common case automatically after a merge, so contributors editing a canonical
# skill do not have to remember the copy step.
#
# The copy loop walks skills/*/ rather than naming them, so a new skill is
# mirrored without editing this file. scripts/check_mirrors.py is still the
# authority on which mirrors must exist; it fails the Verify step if this loop
# missed one.

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "skills/**/reference.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy every canonical skill to its mirror
        run: |
          for dir in skills/*/; do
            name=$(basename "$dir")
            mkdir -p ".cursor/skills/$name"
            for file in SKILL.md reference.md; do
              if [ -f "$dir$file" ]; then
                cp "$dir$file" ".cursor/skills/$name/$file"
              fi
            done
          done

      - name: Verify
        run: python3 scripts/check_mirrors.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "mirrors already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cursor/skills
          git commit -m "chore: sync skill mirrors with the canonical skills/"
          git push
